# Local practice values only. A real Secret never goes into git (use External Secrets / AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
    name: waymate-secrets
    namespace: waymate
type: Opaque
stringData:
    POSTGRES_PASSWORD: local-postgres-password
    DATABASE_URL: postgres://postgres:local-postgres-password@postgres:5432/waymate
    BETTER_AUTH_SECRET: local-only-better-auth-secret-0123456789
    RESEND_API_KEY: re_local_dummy_key
