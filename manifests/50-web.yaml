# nginx serves the SPA and proxies /api to the api Service, the same routing as production (apps/web/vercel.json).
apiVersion: v1
kind: ConfigMap
metadata:
    name: web-nginx
    namespace: waymate
data:
    default.conf: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 8080;
            root /usr/share/nginx/html;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # better-auth lives under /api/auth on the API, so keep the prefix.
            location /api/auth/ {
                proxy_pass http://api:3000;
            }

            # Everything else drops the /api prefix (the trailing slash does that), incl. the chat WebSocket.
            location /api/ {
                proxy_pass http://api:3000/;
            }

            # SPA fallback: unknown paths return index.html and the client router handles them.
            location / {
                try_files $uri /index.html;
            }
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
    namespace: waymate
spec:
    replicas: 2
    selector:
        matchLabels:
            app: web
    template:
        metadata:
            labels:
                app: web
        spec:
            containers:
                - name: web
                  image: waymate-web:v1
                  ports:
                      - containerPort: 8080
                  volumeMounts:
                      - name: nginx-config
                        mountPath: /etc/nginx/conf.d
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 8080
                      periodSeconds: 5
                  resources:
                      requests: { cpu: 50m, memory: 32Mi }
                      limits: { memory: 64Mi }
            volumes:
                - name: nginx-config
                  configMap:
                      name: web-nginx
---
apiVersion: v1
kind: Service
metadata:
    name: web
    namespace: waymate
spec:
    selector:
        app: web
    ports:
        - port: 80
          targetPort: 8080
