apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    namespace: waymate
spec:
    replicas: 3
    selector:
        matchLabels:
            app: api
    template:
        metadata:
            labels:
                app: api
        spec:
            containers:
                - name: api
                  image: waymate-api:v2
                  ports:
                      - containerPort: 3000
                  envFrom:
                      - configMapRef:
                            name: waymate-config
                      - secretRef:
                            name: waymate-secrets
                  env: 
                    - name: RENDER_GIT_COMMIT
                      value: v2
                  # Readiness checks the DB (/health returns 503 when it is down): the pod leaves the Service but is not restarted.
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3000
                      periodSeconds: 5
                      failureThreshold: 2
                  # Liveness only checks that the process accepts connections, so a DB outage never restarts the API.
                  livenessProbe:
                      tcpSocket:
                          port: 3000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  resources:
                      requests: { cpu: 100m, memory: 128Mi }
                      limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
    name: api
    namespace: waymate
spec:
    selector:
        app: api
    ports:
        - port: 3000
          targetPort: 3000
